# Supabase CLI project configuration (local dev + deploy defaults).
# The remote project is selected with `supabase link --project-ref <ref>`
# (see scripts/deploy-supabase.sh). Auth/URL settings below apply to local dev;
# mirror site_url / redirect URLs in the dashboard for production.
project_id = "botan-ecommerce"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
# Replace with your production storefront URL.
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080", "http://localhost:5173", "https://shop.example.com"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"

[auth.sms]
enable_signup = false

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# Payments: JWT required; the function re-checks the caller and permissions.
[functions.waafi-pay]
enabled = true
verify_jwt = true
entrypoint = "./functions/waafi-pay/index.ts"

# Staff/admin user management (requires users.manage).
[functions.admin-users]
enabled = true
verify_jwt = true
entrypoint = "./functions/admin-users/index.ts"
